name: Generar Keystore (ejecutar UNA SOLA VEZ)

on:
  workflow_dispatch: # solo se ejecuta manualmente

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generar keystore de firma
        run: |
          keytool -genkeypair -v \
            -keystore sigpip.keystore \
            -alias sigpip \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass SigpipChubut2026 \
            -keypass SigpipChubut2026 \
            -dname "CN=Ministerio de Produccion Chubut, OU=SIGPIP, O=Gobierno de Chubut, L=Rawson, ST=Chubut, C=AR"

      - name: Convertir keystore a base64
        run: |
          base64 -w 0 sigpip.keystore > keystore_base64.txt
          echo "" >> keystore_base64.txt
          echo "--- INSTRUCCIONES ---" >> keystore_base64.txt
          echo "Copia el texto de arriba (la linea larga) como secreto KEYSTORE_BASE64 en GitHub" >> keystore_base64.txt
          echo "Password del keystore: SigpipChubut2026" >> keystore_base64.txt
          echo "Alias: sigpip" >> keystore_base64.txt

      - name: Subir como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: keystore-info
          path: keystore_base64.txt
          retention-days: 1
