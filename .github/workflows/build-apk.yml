name: Build SIGPIP Inspecciones APK

on:
  push:
    branches: [main]
    paths:
      - 'inspector-app/**'
      - 'web/public/actas-inspeccion/index.html'
  workflow_dispatch: # permite dispararlo manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias Capacitor
        run: cd inspector-app && npm install

      - name: Agregar plataforma Android
        run: cd inspector-app && npx cap add android

      - name: Copiar plugin MockLocation a Android
        run: |
          JAVA_DIR="inspector-app/android/app/src/main/java/ar/gob/chubut/sigpip/inspecciones"
          mkdir -p "$JAVA_DIR"
          cp inspector-app/android-plugin/MockLocationPlugin.java "$JAVA_DIR/"
          cp inspector-app/android-plugin/MainActivity.java "$JAVA_DIR/"

      - name: Sincronizar Capacitor con Android
        run: cd inspector-app && npx cap sync android

      - name: Compilar APK (debug)
        run: |
          cd inspector-app/android
          chmod +x gradlew
          ./gradlew assembleDebug --info 2>&1 | tail -100

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SIGPIP-Inspecciones-v${{ github.run_number }}
          path: inspector-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
