name: Build SIGPIP Inspecciones APK

on:
  push:
    branches: [main]
    paths:
      - 'inspector-app/**'
      - 'web/public/actas-inspeccion/index.html'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias Capacitor
        run: cd inspector-app && npm install

      - name: Agregar plataforma Android
        run: cd inspector-app && npx cap add android

      - name: Copiar plugin MockLocation a Android
        run: |
          JAVA_DIR="inspector-app/android/app/src/main/java/ar/gob/chubut/sigpip/inspecciones"
          mkdir -p "$JAVA_DIR"
          cp inspector-app/android-plugin/MockLocationPlugin.java "$JAVA_DIR/"
          cp inspector-app/android-plugin/MainActivity.java "$JAVA_DIR/"

      - name: Sincronizar Capacitor con Android
        run: cd inspector-app && npx cap sync android

      - name: Agregar permisos al AndroidManifest
        run: |
          python3 - <<'EOF'
          path = "inspector-app/android/app/src/main/AndroidManifest.xml"
          with open(path, encoding="utf-8") as f:
              m = f.read()
          perms = [
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.QUERY_ALL_PACKAGES",
          ]
          for name in perms:
              if name not in m:
                  tag = '    <uses-permission android:name="%s"/>\n' % name
                  m = m.replace("</manifest>", tag + "</manifest>")
          with open(path, "w", encoding="utf-8") as f:
              f.write(m)
          print("Permisos en manifest OK")
          EOF

      - name: Generar íconos de app en todos los tamaños Android
        run: |
          sudo apt-get install -y imagemagick
          ICON="inspector-app/icon-source.png"
          RES="inspector-app/android/app/src/main/res"
          # Íconos estándar (fondo blanco para que la silueta se vea bien)
          for size in "48:mdpi" "72:hdpi" "96:xhdpi" "144:xxhdpi" "192:xxxhdpi"; do
            px="${size%%:*}"; dpi="${size##*:}"
            convert "$ICON" -background white -flatten -resize "${px}x${px}" "$RES/mipmap-${dpi}/ic_launcher.png"
            cp "$RES/mipmap-${dpi}/ic_launcher.png" "$RES/mipmap-${dpi}/ic_launcher_round.png"
          done
          # Eliminar íconos adaptativos (XML conflictúan con nuestros PNG)
          rm -f "$RES/drawable/ic_launcher_foreground.xml"
          rm -f "$RES/drawable/ic_launcher_background.xml"
          rm -rf "$RES/mipmap-anydpi-v26"

      - name: Restaurar keystore de firma
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > inspector-app/android/sigpip.keystore

      - name: Compilar APK release firmado
        run: |
          cd inspector-app/android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/sigpip.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEYSTORE_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_PASSWORD }}

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: SIGPIP-Inspecciones-v${{ github.run_number }}
          path: inspector-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
