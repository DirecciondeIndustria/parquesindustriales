name: Build SIGPIP Inspecciones APK

on:
  push:
    branches: [main]
    paths:
      - 'inspector-app/**'
      - 'web/public/actas-inspeccion/index.html'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias Capacitor
        run: cd inspector-app && npm install

      - name: Agregar plataforma Android
        run: cd inspector-app && npx cap add android

      - name: Copiar plugin MockLocation a Android
        run: |
          JAVA_DIR="inspector-app/android/app/src/main/java/ar/gob/chubut/sigpip/inspecciones"
          mkdir -p "$JAVA_DIR"
          cp inspector-app/android-plugin/MockLocationPlugin.java "$JAVA_DIR/"
          cp inspector-app/android-plugin/MainActivity.java "$JAVA_DIR/"

      - name: Sincronizar Capacitor con Android
        run: cd inspector-app && npx cap sync android

      - name: Restaurar keystore de firma
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > inspector-app/android/sigpip.keystore

      - name: Compilar APK firmado (release)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          cd inspector-app/android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/sigpip.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEYSTORE_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_PASSWORD }}

      - name: Compilar APK debug (si no hay keystore aún)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: |
          cd inspector-app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK release como artefacto
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SIGPIP-Inspecciones-v${{ github.run_number }}
          path: inspector-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Subir APK debug como artefacto
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SIGPIP-Inspecciones-v${{ github.run_number }}-debug
          path: inspector-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
