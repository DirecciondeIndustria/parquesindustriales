name: Build SIGPIP Inspecciones APK

on:
  push:
    branches: [main]
    paths:
      - 'inspector-app/**'
      - 'web/public/actas-inspeccion/index.html'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias Capacitor
        run: cd inspector-app && npm install

      - name: Agregar plataforma Android
        run: cd inspector-app && npx cap add android

      - name: Copiar plugin MockLocation a Android
        run: |
          JAVA_DIR="inspector-app/android/app/src/main/java/ar/gob/chubut/sigpip/inspecciones"
          mkdir -p "$JAVA_DIR"
          cp inspector-app/android-plugin/MockLocationPlugin.java "$JAVA_DIR/"
          cp inspector-app/android-plugin/MainActivity.java "$JAVA_DIR/"

      - name: Generar íconos de app en todos los tamaños Android
        run: |
          sudo apt-get install -y imagemagick
          ICON="inspector-app/icon-source.png"
          RES="inspector-app/android/app/src/main/res"
          # Fondo blanco para el ícono (la silueta es transparente)
          convert "$ICON" -background white -flatten -resize 48x48   "$RES/mipmap-mdpi/ic_launcher.png"
          convert "$ICON" -background white -flatten -resize 72x72   "$RES/mipmap-hdpi/ic_launcher.png"
          convert "$ICON" -background white -flatten -resize 96x96   "$RES/mipmap-xhdpi/ic_launcher.png"
          convert "$ICON" -background white -flatten -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher.png"
          convert "$ICON" -background white -flatten -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher.png"
          # Íconos redondos (mismas imágenes)
          cp "$RES/mipmap-mdpi/ic_launcher.png"    "$RES/mipmap-mdpi/ic_launcher_round.png"
          cp "$RES/mipmap-hdpi/ic_launcher.png"    "$RES/mipmap-hdpi/ic_launcher_round.png"
          cp "$RES/mipmap-xhdpi/ic_launcher.png"   "$RES/mipmap-xhdpi/ic_launcher_round.png"
          cp "$RES/mipmap-xxhdpi/ic_launcher.png"  "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

      - name: Sincronizar Capacitor con Android
        run: cd inspector-app && npx cap sync android

      - name: Restaurar keystore de firma
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > inspector-app/android/sigpip.keystore

      - name: Compilar APK release firmado
        run: |
          cd inspector-app/android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/sigpip.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEYSTORE_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_PASSWORD }}

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: SIGPIP-Inspecciones-v${{ github.run_number }}
          path: inspector-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
